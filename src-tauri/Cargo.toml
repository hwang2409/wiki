[package]
name = "wiki-native"
version = "0.1.0"
description = "Native macOS shell for Henry's wiki"
authors = ["Henry"]
edition = "2021"
rust-version = "1.82.0"

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
libc = "0.2.177"
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
sha2 = "0.10"
serde_json = "1"
tauri = { version = "2.11.5", features = ["dynamic-acl"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["dynamic-acl", "test"] }
